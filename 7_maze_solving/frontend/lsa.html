<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live LSA</title>
<style>
	* { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Tahoma, sans-serif; }
	body { background: #1a202c; color: #e2e8f0; min-height: 100vh; display: flex;
		justify-content: center; align-items: center; padding: 16px; }
	main { width: 100%; max-width: 560px; }
	h1 { font-size: 1.4em; margin-bottom: 4px; }
	.sub { color: #a0aec0; font-size: 0.9em; margin-bottom: 20px; }
	.bars { display: flex; gap: 10px; align-items: flex-end; height: 220px; }
	.col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; }
	.track { flex: 1; width: 100%; background: #2d3748; border-radius: 6px; position: relative;
		overflow: hidden; }
	.fill { position: absolute; bottom: 0; width: 100%; background: #4a5568; transition: height 0.1s; }
	.col.on .fill { background: #f7fafc; }
	.val { margin-top: 6px; font-variant-numeric: tabular-nums; font-size: 1.05em; }
	.name { color: #a0aec0; font-size: 0.8em; }
	.thr { position: absolute; left: 0; right: 0; border-top: 2px dashed #f6ad55; }
	.info { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px;
		flex-wrap: wrap; font-size: 1.05em; }
	.info b { font-variant-numeric: tabular-nums; }
	.pattern { font-family: Consolas, monospace; letter-spacing: 4px; font-size: 1.3em; }
	.stale { color: #fc8181; }
	a { color: #90cdf4; }
</style>
</head>
<body>
<main>
	<h1>Live LSA</h1>
	<p class="sub">Left (U5) to right (U1). White fills a bar, dashed line = white threshold 820.
		<a href="/">PID tuning</a></p>
	<div class="bars" id="bars"></div>
	<div class="info">
		<span>Pattern <b class="pattern" id="pattern">-----</b></span>
		<span>Position <b id="pos">-</b></span>
		<span>State <b id="state">-</b></span>
	</div>
	<p class="sub" id="status" style="margin-top:16px">connecting...</p>
</main>
<script>
	const THRESHOLD = 820;
	const names = ["A0 / U5", "A1 / U4", "A2 / U3", "A3 / U2", "A4 / U1"];
	const bars = document.getElementById("bars");
	const cols = names.map((n) => {
		const col = document.createElement("div");
		col.className = "col";
		col.innerHTML = '<div class="track"><div class="fill"></div>' +
			'<div class="thr" style="bottom:' + THRESHOLD / 10 + '%"></div></div>' +
			'<div class="val">-</div><div class="name">' + n + "</div>";
		bars.appendChild(col);
		return col;
	});
	const status = document.getElementById("status");
	let lastOk = 0;

	async function poll() {
		try {
			const res = await fetch("/api/v1/lsa", { cache: "no-store" });
			const d = await res.json();
			d.r.forEach((v, i) => {
				cols[i].querySelector(".fill").style.height = Math.max(0, Math.min(100, v / 10)) + "%";
				cols[i].querySelector(".val").textContent = v;
				cols[i].classList.toggle("on", d.on[i] === 1);
			});
			document.getElementById("pattern").textContent = d.on.join("");
			document.getElementById("pos").textContent = d.pos.toFixed(2);
			document.getElementById("state").textContent = d.state;
			lastOk = Date.now();
			status.textContent = "live";
			status.classList.remove("stale");
		} catch (e) {
			if (Date.now() - lastOk > 1000) {
				status.textContent = "no data from the bot";
				status.classList.add("stale");
			}
		}
		setTimeout(poll, 150);
	}
	poll();
</script>
</body>
</html>
